<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>預約系統界面 - 個人查詢版</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .search-result-table { width: 100%; border-collapse: collapse; margin-top: 15px; border: 1px solid #3498db; }
        .search-result-table th, .search-result-table td { border: 1px solid #ddd; padding: 10px; text-align: left; font-size: 0.9em; }
        .search-result-table th { background-color: #3498db; color: white; }
    </style>
</head>
<body>
    <div class="nav-links"><a href="#" id="logoutBtn">登出</a></div>
    <div class="container">
        <h2>康健綜合診所 - 預約登記</h2>
        
        <div style="background: #ecf0f1; padding: 15px; border-radius: 5px; margin-bottom: 20px;">
            <p><strong>歡迎，<span id="welcomeName"></span> (<span id="welcomePhone"></span>)</strong></p>
        </div>

        <div class="form-group">
            <label>預約日期</label>
            <input type="date" id="appointDate" required>
        </div>
        <div class="form-group">
            <label>時段</label>
            <select id="appointSession">
                <option value="AM">上午 (09:00-12:00)</option>
                <option value="PM">下午 (14:00-17:00)</option>
            </select>
        </div>
        <div class="form-group">
            <label>指定醫生</label>
            <select id="doctorName">
                <option value="Any">任何醫生</option>
                <option value="Dr. Chan">陳醫生 (家庭科)</option>
                <option value="Dr. Wong">王醫生 (專科)</option>
            </select>
        </div>
        <button id="submitBtn">提交預約</button>
        
        <button class="secondary" id="myBookingsBtn" style="margin-top: 15px; background-color: #27ae60;">預約查詢</button>
        
        <div id="searchResultSection" class="hidden" style="margin-top: 25px; border-top: 2px solid #ddd; padding-top: 15px;">
            <h3>您的未來預約紀錄</h3>
            <table class="search-result-table" id="searchResultTable">
                <thead>
                    <tr>
                        <th>日期</th>
                        <th>時段</th>
                        <th>醫生</th>
                        <th>籌號</th>
                    </tr>
                </thead>
                <tbody id="searchResultBody">
                    </tbody>
            </table>
        </div>
    </div>

    <script>
        // ... (原本的 權限檢查和日期設定邏輯保持不變 ... )
        const currentPatient = JSON.parse(sessionStorage.getItem('currentPatient'));
        if (!currentPatient || sessionStorage.getItem('userRole') !== 'booker') {
            alert('未授權訪問，請先登入。');
            window.location.href = 'index.html';
        } else {
            document.getElementById('welcomeName').innerText = currentPatient.name;
            document.getElementById('welcomePhone').innerText = currentPatient.phone;
        }

        const today = new Date();
        const tomorrow = new Date(today);
        tomorrow.setDate(tomorrow.getDate() + 1);
        document.getElementById('appointDate').min = tomorrow.toISOString().split('T')[0];

        // ... (原本的 提交預約邏輯保持不變 ... )
        document.getElementById('submitBtn').addEventListener('click', function() {
            // ... (原本的 提交邏輯 ... )
            const date = document.getElementById('appointDate').value;
            const session = document.getElementById('appointSession').value;
            let doctor = document.getElementById('doctorName').value;

            if (!date) { alert('請選擇日期。'); return; }

            let appointments = JSON.parse(localStorage.getItem('clinic_appts')) || [];

            const availableDoctors = ['Dr. Chan', 'Dr. Wong'];
            if (doctor === 'Any') {
                let found = false;
                for (let d of availableDoctors) {
                    if (getQuotaUsed(appointments, date, session, d) < 15) {
                        doctor = d;
                        found = true;
                        break;
                    }
                }
                if (!found) {
                    alert('很抱歉，該時段所有醫生的預約已滿。');
                    return;
                }
            } else {
                const used = getQuotaUsed(appointments, date, session, doctor);
                if (used >= 15) {
                    alert(`很抱歉，${doctor} 在 ${date} ${session==='AM'?'上午':'下午'} 的預約已滿 (15/15)。請選擇其他時段或醫生。`);
                    return;
                }
            }

            const quotaNumber = getQuotaUsed(appointments, date, session, doctor) + 1;
            const newAppt = {
                id: Date.now(),
                name: currentPatient.name,
                phone: currentPatient.phone,
                date, session, doctor,
                quotaNumber,
                timestamp: new Date().toLocaleString()
            };
            appointments.push(newAppt);
            localStorage.setItem('clinic_appts', JSON.stringify(appointments));

            sessionStorage.setItem('lastAppt', JSON.stringify(newAppt));
            window.location.href = 'receipt.html';
        });

        // 輔助函數：計算已使用配額
        function getQuotaUsed(appts, date, session, doctor) {
            return appts.filter(a => a.date === date && a.session === session && a.doctor === doctor).length;
        }


        // --- 核心修訂 3: 實施「預約查詢」邏輯 ---
        // 學生 IDEA: 模擬一個複雜的數據查詢 (過濾用戶 + 過濾未來日期)
        document.getElementById('myBookingsBtn').addEventListener('click', function() {
            // 從 localStorage 獲取所有預約 (模擬從 APPOINTMENT DATABASE 讀取)
            const appointments = JSON.parse(localStorage.getItem('clinic_appts')) || [];
            const resultSection = document.getElementById('searchResultSection');
            const resultBody = document.getElementById('searchResultBody');
            resultBody.innerHTML = ''; // 清空舊結果

            // 今天日期的 YYYY-MM-DD 格式，用於比較
            const todayStr = new Date().toISOString().split('T')[0];

            // 數據過濾：
            // 條件 1: 匹配用戶電話
            // 條件 2: 日期大於或等於「當天」 (模擬未來的預約)
            const myFilteredAppts = appointments.filter(a => 
                a.phone === currentPatient.phone && a.date >= todayStr
            );

            // 排序：日期 -> 時段 -> 籌號
            myFilteredAppts.sort((a, b) => {
                if (a.date !== b.date) return a.date.localeCompare(b.date);
                if (a.session !== b.session) return b.session.localeCompare(a.session); // AM before PM
                return a.quotaNumber - b.quotaNumber;
            });

            // 顯示結果
            resultSection.classList.remove('hidden');

            if (myFilteredAppts.length === 0) {
                resultBody.innerHTML = '<tr><td colspan="4" style="text-align:center;">找不到符合條件的未來預約。</td></tr>';
            } else {
                myFilteredAppts.forEach(a => {
                    const row = `
                        <tr>
                            <td>${a.date}</td>
                            <td>${a.session==='AM'?'上午':'下午'}</td>
                            <td>${a.doctor}</td>
                            <td><strong>${a.quotaNumber}</strong></td>
                        </tr>
                    `;
                    resultBody.innerHTML += row;
                });
            }
        });


        // 登出
        document.getElementById('logoutBtn').addEventListener('click', function() {
            sessionStorage.clear();
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
